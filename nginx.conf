server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for fingerprinted assets, no caching for the SPA
    # shell so deploys are picked up immediately.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unknown path serves index.html so client-side
    # routing works for /cases/:id, /households/:id, etc.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html itself so the latest deploy is served.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Security headers — no inline JS, no eval, allow Google Fonts CSS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
